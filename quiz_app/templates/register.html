{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card glass-card p-5 fade-in mt-5 shadow-lg border-0">
            <h3 class="text-center mb-4 fw-bold" style="color: #00b894;">Student Registration</h3>
            <form method="POST">
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="username" placeholder="Username" required>
                    <label for="username">Username</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-bold">Register</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top">
                <p>Already Registered? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold" style="color: #0984e3;">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
