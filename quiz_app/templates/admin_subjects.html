{% extends "base.html" %}
{% block content %}
<div class="row fade-in mt-4">
    <div class="col-md-3">
        <div class="list-group shadow-sm border-0 rounded-4 overflow-hidden mb-4">
            <a href="{{ url_for('admin_dashboard') }}" class="list-group-item list-group-item-action fw-medium py-3 border-0 border-bottom"><i class="bi bi-speedometer2 me-2 text-muted"></i>Dashboard</a>
            <a href="{{ url_for('admin_subjects') }}" class="list-group-item list-group-item-action fw-bold active py-3 border-0 border-bottom"><i class="bi bi-book text-light me-2"></i>Subjects</a>
            <a href="{{ url_for('admin_questions') }}" class="list-group-item list-group-item-action fw-medium py-3 border-0 border-bottom"><i class="bi bi-ui-checks me-2 text-muted"></i>Questions</a>
            <a href="{{ url_for('admin_students') }}" class="list-group-item list-group-item-action fw-medium py-3 border-0 border-bottom"><i class="bi bi-people me-2 text-muted"></i>Students</a>
            <a href="{{ url_for('admin_results') }}" class="list-group-item list-group-item-action fw-medium py-3 border-0"><i class="bi bi-bar-chart me-2 text-muted"></i>Results</a>
        </div>
    </div>
    <div class="col-md-9">
        <div class="card shadow-sm border-0 mb-4 p-5 glass-card rounded-4">
            <h3 class="fw-bold mb-4 text-dark"><i class="bi bi-journals border p-2 rounded text-primary bg-primary bg-opacity-10 me-2"></i> Manage Subjects</h3>
            <form method="POST" class="bg-light p-4 rounded-4 py-4 border">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8">
                        <label class="form-label fw-bold text-muted small text-uppercase"><i class="bi bi-pencil-square me-1"></i> New Subject Name</label>
                        <input type="text" name="name" class="form-control form-control-lg border-light shadow-sm" placeholder="e.g. Computer Science 101" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100 btn-lg rounded-3 fw-bold shadow-sm"><i class="bi bi-plus-lg me-1"></i> Create</button>
                    </div>
                </div>
            </form>
            <div class="mt-5">
                <table class="table table-hover align-middle border rounded overflow-hidden">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 px-4 text-muted border-0">ID</th>
                            <th class="py-3 px-4 text-muted border-0">Subject Name</th>
                            <th class="py-3 px-4 text-end text-muted border-0">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for sub in subjects %}
                        <tr>
                            <td class="text-muted fw-medium px-4 border-light">#{{ sub.id }}</td>
                            <td class="fw-bold text-dark fs-5 px-4 border-light">{{ sub.name }}</td>
                            <td class="text-end px-4 border-light">
                                <span class="badge bg-success bg-opacity-10 text-success py-2 px-3 fw-bold border border-success border-opacity-25 rounded-pill"><i class="bi bi-check2-circle me-1"></i> Active</span>
                            </td>
                        </tr>
                        {% endfor %}
                        {% if not subjects %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-5 border-light"><i class="bi bi-folder-x display-6 d-block mb-3 opacity-50"></i>No subjects yet. Create one above!</td>
                        </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
