{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card glass-card p-5 fade-in mt-5 shadow-lg border-0">
            <h3 class="text-center mb-4 fw-bold" style="color: #e1b12c;">Modify Password</h3>
            <form method="POST">
                <div class="form-floating mb-3">
                    <input type="password" name="old_password" class="form-control" id="old_password" placeholder="Old Password" required>
                    <label for="old_password">Old Password</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" name="new_password" class="form-control" id="new_password" placeholder="New Password" required>
                    <label for="new_password">New Password</label>
                </div>
                <button type="submit" class="btn btn-warning w-100 py-3 rounded-pill fw-bold text-white">Update Password</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top">
                <a href="{{ url_for('quiz_intro') }}" class="text-decoration-none text-muted">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
